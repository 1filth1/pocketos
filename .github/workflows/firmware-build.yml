name: PocketOS firmware build

on:
  push:
    branches: [release/pocketos-1.0]
    tags: ['v*']
  pull_request:
    branches: [release/pocketos-1.0]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  arduino-build:
    name: Compile ESP32-S3 firmware
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install pinned Arduino-ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12

      - name: Install pinned libraries
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "GxEPD2@1.6.9"
          arduino-cli lib install "Adafruit GFX Library@1.13.0"
          arduino-cli lib install "Adafruit BusIO@1.17.4"
          arduino-cli lib install "U8g2_for_Adafruit_GFX@1.8.0"
          arduino-cli lib install "Adafruit SSD1306@2.5.17"
          arduino-cli lib install "JPEGDEC@1.8.5"
          arduino-cli lib install "bb_spi_lcd@2.9.10"
          arduino-cli lib install "TinyGPSPlus@1.0.3"

      - name: Compile PocketOS for Waveshare N16R8
        env:
          FQBN: esp32:esp32:esp32s3:CDCOnBoot=cdc,CPUFreq=240,FlashMode=dio,FlashSize=16M,PartitionScheme=app3M_fat9M_16MB,PSRAM=opi
        run: |
          arduino-cli compile --fqbn "$FQBN" --warnings all --output-dir "$RUNNER_TEMP/pocketos-build" .

      - name: Locate Arduino-ESP32 boot_app0
        id: boot-app0
        run: |
          mapfile -t BOOT_APP0_FILES < <(find "$HOME/.arduino15/packages/esp32" -type f -name boot_app0.bin -print)
          if [ "${#BOOT_APP0_FILES[@]}" -ne 1 ]; then
            printf 'Expected one boot_app0.bin in installed Arduino-ESP32 package; found %s\n' "${#BOOT_APP0_FILES[@]}"
            printf '%s\n' "${BOOT_APP0_FILES[@]}"
            exit 1
          fi
          echo "path=${BOOT_APP0_FILES[0]}" >> "$GITHUB_OUTPUT"
          echo "Using ${BOOT_APP0_FILES[0]}"

      - name: Package and validate firmware bundle
        env:
          GITHUB_SHA: ${{ github.sha }}
          RELEASE_VERSION: PocketOS-${{ github.ref_type == 'tag' && github.ref_name || (github.ref == 'refs/heads/release/pocketos-1.0' && 'v0.1.2-rc.1' || 'development') }}
        run: |
          python3 scripts/package_firmware.py "$RUNNER_TEMP/pocketos-build" "$RUNNER_TEMP/pocketos-release" "${{ steps.boot-app0.outputs.path }}"
          mkdir -p "$RUNNER_TEMP/pocketos-pages"
          cp webflasher/index.html "$RUNNER_TEMP/pocketos-pages/index.html"
          cp "$RUNNER_TEMP/pocketos-release/"* "$RUNNER_TEMP/pocketos-pages/"

      - name: Report firmware artifact sizes
        run: |
          find "$RUNNER_TEMP/pocketos-release" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: pocketos-firmware-and-webflasher
          path: |
            ${{ runner.temp }}/pocketos-release/*
            ${{ runner.temp }}/pocketos-pages/index.html
          if-no-files-found: error

      - name: Validate release notes and changelog entry
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          NOTES_FILE="RELEASE_NOTES_${RELEASE_TAG}.md"
          CHANGELOG_VERSION="${RELEASE_TAG#v}"
          test -s "$NOTES_FILE" || { echo "Missing bilingual release notes: $NOTES_FILE" >&2; exit 1; }
          grep -Fq "## [${CHANGELOG_VERSION}]" CHANGELOG.md || {
            echo "Missing CHANGELOG.md section: ## [${CHANGELOG_VERSION}]" >&2
            exit 1
          }
          for heading in "## Added" "## Fixed" "## Changed" "## Known issues" "## Build & package" "## Upgrade"; do
            grep -Fq "$heading" "$NOTES_FILE" || {
              echo "Missing release-notes section: $heading" >&2
              exit 1
            }
          done
          grep -Eiq '^#.*(Русский|Russian)' "$NOTES_FILE" || {
            echo "Release notes must contain a Russian section." >&2
            exit 1
          }

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && (github.ref_type == 'tag' || github.ref == 'refs/heads/release/pocketos-1.0')
        uses: actions/configure-pages@v5

      - name: Upload Web Flasher site
        if: github.event_name == 'push' && (github.ref_type == 'tag' || github.ref == 'refs/heads/release/pocketos-1.0')
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pocketos-pages

      - name: Deploy Web Flasher
        if: github.event_name == 'push' && (github.ref_type == 'tag' || github.ref == 'refs/heads/release/pocketos-1.0')
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish PocketOS release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Refusing to reuse an existing $RELEASE_TAG release; publish a new version instead." >&2
            exit 1
          fi
          RELEASE_ARGS=()
          if [[ "$RELEASE_TAG" =~ (alpha|beta|rc|pre) ]]; then
            RELEASE_ARGS+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/pocketos-release/PocketOS-firmware.zip" \
            "$RUNNER_TEMP/pocketos-release/bootloader.bin" \
            "$RUNNER_TEMP/pocketos-release/partitions.bin" \
            "$RUNNER_TEMP/pocketos-release/boot_app0.bin" \
            "$RUNNER_TEMP/pocketos-release/application.bin" \
            "$RUNNER_TEMP/pocketos-release/manifest.json" \
            "$RUNNER_TEMP/pocketos-release/SHA256SUMS" \
            --target "$GITHUB_SHA" \
            --title "PocketOS $RELEASE_TAG — Waveshare N16R8 / DIO" \
            "${RELEASE_ARGS[@]}" \
            --notes-file "RELEASE_NOTES_${RELEASE_TAG}.md"
