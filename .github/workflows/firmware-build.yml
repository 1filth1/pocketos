name: PocketOS firmware build

on:
  push:
    branches: [release/pocketos-1.0]
    tags: ['v*']
  pull_request:
    branches: [release/pocketos-1.0]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: write
  pages: write
  id-token: write

jobs:
  arduino-build:
    name: Compile ESP32-S3 firmware
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python for SD artwork generation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install artwork generator dependency
        run: python -m pip install Pillow

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install pinned Arduino-ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12

      - name: Install pinned libraries
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "GxEPD2@1.6.9"
          arduino-cli lib install "Adafruit GFX Library@1.13.0"
          arduino-cli lib install "Adafruit BusIO@1.17.4"
          arduino-cli lib install "U8g2_for_Adafruit_GFX@1.8.0"
          arduino-cli lib install "Adafruit SSD1306@2.5.17"
          arduino-cli lib install "JPEGDEC@1.8.5"
          arduino-cli lib install "bb_spi_lcd@2.9.10"
          arduino-cli lib install "TinyGPSPlus@1.0.3"
          arduino-cli lib install "ArduinoJson@7.4.2"

      - name: Compile PocketOS for Waveshare N16R8
        env:
          FQBN: esp32:esp32:esp32s3:CDCOnBoot=cdc,CPUFreq=240,FlashMode=dio,FlashSize=16M,PartitionScheme=app3M_fat9M_16MB,PSRAM=opi
        run: |
          arduino-cli compile --fqbn "$FQBN" --warnings all --output-dir "$RUNNER_TEMP/pocketos-build" .

      - name: Locate Arduino-ESP32 boot_app0
        id: boot-app0
        run: |
          mapfile -t BOOT_APP0_FILES < <(find "$HOME/.arduino15/packages/esp32" -type f -name boot_app0.bin -print)
          if [ "${#BOOT_APP0_FILES[@]}" -ne 1 ]; then
            printf 'Expected one boot_app0.bin in installed Arduino-ESP32 package; found %s\n' "${#BOOT_APP0_FILES[@]}"
            printf '%s\n' "${BOOT_APP0_FILES[@]}"
            exit 1
          fi
          echo "path=${BOOT_APP0_FILES[0]}" >> "$GITHUB_OUTPUT"
          echo "Using ${BOOT_APP0_FILES[0]}"

      - name: Generate JDM Garage Empire SD artwork
        run: python3 scripts/generate_jdm_assets.py sdcard/root

      - name: Validate JDM Garage Empire SD content
        run: python3 scripts/validate_jdm_content.py sdcard/root

      - name: Package and validate firmware bundle
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RELEASE_VERSION="PocketOS-${GITHUB_REF_NAME}"
          else
            FIRMWARE_VERSION=$(sed -n 's/^#define POCKETOS_VERSION "\(.*\)"/\1/p' version.h)
            test -n "$FIRMWARE_VERSION" || { echo "Unable to read POCKETOS_VERSION from version.h" >&2; exit 1; }
            RELEASE_VERSION="PocketOS-v${FIRMWARE_VERSION}"
          fi
          export RELEASE_VERSION
          python3 scripts/package_firmware.py "$RUNNER_TEMP/pocketos-build" "$RUNNER_TEMP/pocketos-release" "${{ steps.boot-app0.outputs.path }}"
          python3 scripts/package_sdcard.py sdcard/root "$RUNNER_TEMP/pocketos-release" "$RELEASE_VERSION" "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/pocketos-pages"
          cp webflasher/index.html "$RUNNER_TEMP/pocketos-pages/index.html"
          cp "$RUNNER_TEMP/pocketos-release/"* "$RUNNER_TEMP/pocketos-pages/"

      - name: Build Web Flasher release catalogue
        if: github.event_name == 'push' && (github.ref_type == 'tag' || github.ref == 'refs/heads/release/pocketos-1.0')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 100 --json tagName,name,isPrerelease > "$RUNNER_TEMP/existing-releases.json"
          python3 - "$RUNNER_TEMP/pocketos-pages" "$RUNNER_TEMP/existing-releases.json" <<'PY'
          import json, pathlib, subprocess, sys
          root = pathlib.Path(sys.argv[1])
          existing = json.loads(pathlib.Path(sys.argv[2]).read_text())
          current = json.loads((root / "manifest.json").read_text())
          current_tag = current["version"].removeprefix("PocketOS-")
          current_notes = pathlib.Path(f"RELEASE_NOTES_{current_tag}.md")
          current_description = current_notes.read_text(encoding="utf-8") if current_notes.is_file() else "Описание для текущей сборки пока не добавлено."
          releases = [{
              "name": current["version"] + " (текущая сборка)",
              "tag": current_tag,
              "path": "./",
              "prerelease": True,
              "description": current_description,
              "url": f"https://github.com/1filth1/pocketos/releases/tag/{current_tag}",
              "sdCardUrl": f"https://github.com/1filth1/pocketos/releases/download/{current_tag}/PocketOS-SD-card-{current_tag}.zip",
              "sdCardChecksumUrl": f"https://github.com/1filth1/pocketos/releases/download/{current_tag}/PocketOS-SD-card-{current_tag}.zip.sha256"
          }]
          for item in existing:
              tag = item["tagName"]
              if tag == releases[0]["tag"]:
                  continue
              folder = root / "releases" / tag
              folder.mkdir(parents=True, exist_ok=True)
              subprocess.run([
                  "gh", "release", "download", tag, "--dir", str(folder),
                  "--pattern", "*.bin", "--pattern", "manifest.json", "--pattern", "SHA256SUMS",
                  "--pattern", "PocketOS-SD-card-*.zip", "--pattern", "PocketOS-SD-card-*.zip.sha256"
              ], check=False)
              required = ["manifest.json", "SHA256SUMS", "bootloader.bin", "partitions.bin", "boot_app0.bin", "application.bin"]
              if not all((folder / name).is_file() for name in required):
                  print(f"Skipping {tag}: release has no complete firmware bundle")
                  continue
              release_info = subprocess.run(
                  ["gh", "release", "view", tag, "--json", "body", "--jq", ".body"],
                  capture_output=True, text=True, check=False
              )
              description = release_info.stdout.strip()
              if not description:
                  notes_file = pathlib.Path(f"RELEASE_NOTES_{tag}.md")
                  description = notes_file.read_text(encoding="utf-8") if notes_file.is_file() else "Описание этого релиза пока недоступно."
              releases.append({
                  "name": item["name"] or tag,
                  "tag": tag,
                  "path": f"./releases/{tag}/",
                  "prerelease": bool(item["isPrerelease"]),
                  "description": description,
                  "url": f"https://github.com/1filth1/pocketos/releases/tag/{tag}",
                  "sdCardUrl": f"https://github.com/1filth1/pocketos/releases/download/{tag}/PocketOS-SD-card-{tag}.zip" if (folder / f"PocketOS-SD-card-{tag}.zip").is_file() else None,
                  "sdCardChecksumUrl": f"https://github.com/1filth1/pocketos/releases/download/{tag}/PocketOS-SD-card-{tag}.zip.sha256" if (folder / f"PocketOS-SD-card-{tag}.zip.sha256").is_file() else None
              })
          (root / "releases.json").write_text(json.dumps({"releases": releases}, ensure_ascii=False, indent=2) + "\n")
          print(f"Published catalogue entries: {len(releases)}")
          PY

      - name: Report firmware artifact sizes
        run: |
          find "$RUNNER_TEMP/pocketos-release" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: pocketos-firmware-and-webflasher
          path: |
            ${{ runner.temp }}/pocketos-release/*
            ${{ runner.temp }}/pocketos-pages/index.html
          if-no-files-found: error

      - name: Validate release notes and changelog entry
        if: github.event_name == 'push' && (github.ref_type == 'tag' || github.ref == 'refs/heads/release/pocketos-1.0')
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if [[ -z "$RELEASE_TAG" ]]; then
            FIRMWARE_VERSION=$(sed -n 's/^#define POCKETOS_VERSION "\(.*\)"/\1/p' version.h)
            test -n "$FIRMWARE_VERSION" || { echo "Unable to read POCKETOS_VERSION from version.h" >&2; exit 1; }
            RELEASE_TAG="v${FIRMWARE_VERSION}"
          fi
          NOTES_FILE="RELEASE_NOTES_${RELEASE_TAG}.md"
          CHANGELOG_VERSION="${RELEASE_TAG#v}"
          test -s "$NOTES_FILE" || { echo "Missing bilingual release notes: $NOTES_FILE" >&2; exit 1; }
          grep -Fq "## [${CHANGELOG_VERSION}]" CHANGELOG.md || {
            echo "Missing CHANGELOG.md section: ## [${CHANGELOG_VERSION}]" >&2
            exit 1
          }
          for heading in "## Added" "## Fixed" "## Changed" "## Known issues" "## Build & package" "## Upgrade"; do
            grep -Fq "$heading" "$NOTES_FILE" || {
              echo "Missing release-notes section: $heading" >&2
              exit 1
            }
          done
          if ! grep -Eiq '^#.*(Русский|Russian)' "$NOTES_FILE" && ! grep -Fq "## Добавлено" "$NOTES_FILE"; then
            echo "Release notes must contain a Russian section (explicit heading or Russian Added section)." >&2
            exit 1
          fi

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && (github.ref_type == 'tag' || github.ref == 'refs/heads/release/pocketos-1.0')
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Remove stale Pages artifacts from previous attempts
        if: github.event_name == 'push' && (github.ref_type == 'tag' || github.ref == 'refs/heads/release/pocketos-1.0')
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner,
              repo,
              run_id: context.runId,
              name: 'github-pages',
            });
            for (const artifact of data.artifacts) {
              core.info(`Deleting stale Pages artifact ${artifact.id} from this workflow run`);
              await github.rest.actions.deleteArtifact({
                owner,
                repo,
                artifact_id: artifact.id,
              });
            }

      - name: Upload Web Flasher site
        if: github.event_name == 'push' && (github.ref_type == 'tag' || github.ref == 'refs/heads/release/pocketos-1.0')
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pocketos-pages

      - name: Deploy Web Flasher
        if: github.event_name == 'push' && (github.ref_type == 'tag' || github.ref == 'refs/heads/release/pocketos-1.0')
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish PocketOS release
        if: github.event_name == 'push' && (github.ref_type == 'tag' || github.ref == 'refs/heads/release/pocketos-1.0')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if [[ -z "$RELEASE_TAG" ]]; then
            FIRMWARE_VERSION=$(sed -n 's/^#define POCKETOS_VERSION "\(.*\)"/\1/p' version.h)
            test -n "$FIRMWARE_VERSION" || { echo "Unable to read POCKETOS_VERSION from version.h" >&2; exit 1; }
            RELEASE_TAG="v${FIRMWARE_VERSION}"
          fi
          RELEASE_FILES=(
            "$RUNNER_TEMP/pocketos-release/PocketOS-firmware.zip"
            "$RUNNER_TEMP/pocketos-release/bootloader.bin"
            "$RUNNER_TEMP/pocketos-release/partitions.bin"
            "$RUNNER_TEMP/pocketos-release/boot_app0.bin"
            "$RUNNER_TEMP/pocketos-release/application.bin"
            "$RUNNER_TEMP/pocketos-release/manifest.json"
            "$RUNNER_TEMP/pocketos-release/SHA256SUMS"
            "$RUNNER_TEMP/pocketos-release/PocketOS-SD-card-${RELEASE_TAG}.zip"
            "$RUNNER_TEMP/pocketos-release/PocketOS-SD-card-${RELEASE_TAG}.zip.sha256"
          )
          RELEASE_ARGS=()
          if [[ "$RELEASE_TAG" =~ (alpha|beta|rc|pre) ]]; then
            RELEASE_ARGS+=(--prerelease)
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            ASSET_COUNT=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length')
            if [[ "$ASSET_COUNT" -ne 0 ]]; then
              if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
                echo "Refusing to overwrite $RELEASE_TAG from a tag-triggered build: release already contains $ASSET_COUNT assets." >&2
                exit 1
              fi
              echo "Refreshing $ASSET_COUNT existing assets for $RELEASE_TAG from the verified branch build."
            fi
            gh release upload "$RELEASE_TAG" --clobber "${RELEASE_FILES[@]}"
            gh release edit "$RELEASE_TAG" \
              --title "PocketOS $RELEASE_TAG — Waveshare N16R8 / DIO" \
              "${RELEASE_ARGS[@]}" \
              --notes-file "RELEASE_NOTES_${RELEASE_TAG}.md"
          else
            gh release create "$RELEASE_TAG" "${RELEASE_FILES[@]}" \
              --target "$GITHUB_SHA" \
              --title "PocketOS $RELEASE_TAG — Waveshare N16R8 / DIO" \
              "${RELEASE_ARGS[@]}" \
              --notes-file "RELEASE_NOTES_${RELEASE_TAG}.md"
          fi
