name: Publish PocketOS release

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Branch containing firmware and release notes"
        required: true
        type: string
        default: "feature/v0.1.2-boot-diagnostics"
      release_tag:
        description: "New release tag"
        required: true
        type: string
        default: "v0.1.2-rc.1"
      confirm_publish:
        description: "I confirm publishing this firmware and updating Web Flasher"
        required: true
        type: boolean
        default: false

concurrency:
  group: pocketos-publish-release
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publish:
    name: Build, publish and deploy Web Flasher
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs
        env:
          CONFIRM: ${{ inputs.confirm_publish }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$CONFIRM" != "true" ]]; then echo "Confirmation checkbox must be enabled." >&2; exit 1; fi
          if [[ -z "$SOURCE_BRANCH" || "$SOURCE_BRANCH" == *".."* ]]; then echo "Invalid source branch." >&2; exit 1; fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+[.][0-9]+[.][0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then echo "Invalid release tag: $RELEASE_TAG" >&2; exit 1; fi

      - name: Check out selected firmware branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_branch }}
          fetch-depth: 0

      - name: Record exact source commit
        id: source
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Building source commit $(git rev-parse HEAD)"

      - name: Validate tag and bilingual release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 && { echo "Release already exists: $RELEASE_TAG" >&2; exit 1; }
          git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1 && { echo "Git tag already exists: $RELEASE_TAG" >&2; exit 1; }
          NOTES_FILE="RELEASE_NOTES_${RELEASE_TAG}.md"
          CHANGELOG_VERSION="${RELEASE_TAG#v}"
          test -s "$NOTES_FILE" || { echo "Missing $NOTES_FILE" >&2; exit 1; }
          grep -Fq "## [$CHANGELOG_VERSION]" CHANGELOG.md || { echo "Missing CHANGELOG entry for $CHANGELOG_VERSION" >&2; exit 1; }
          for heading in "## Added" "## Fixed" "## Changed" "## Known issues" "## Build & package" "## Upgrade"; do
            grep -Fq "$heading" "$NOTES_FILE" || { echo "Missing section: $heading" >&2; exit 1; }
          done
          grep -Eq '^#.*[А-Яа-яЁё]' "$NOTES_FILE" || { echo "Release notes need a Russian-language section." >&2; exit 1; }

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install pinned Arduino-ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12

      - name: Install pinned libraries
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "GxEPD2@1.6.9"
          arduino-cli lib install "Adafruit GFX Library@1.13.0"
          arduino-cli lib install "Adafruit BusIO@1.17.4"
          arduino-cli lib install "U8g2_for_Adafruit_GFX@1.8.0"
          arduino-cli lib install "Adafruit SSD1306@2.5.17"
          arduino-cli lib install "JPEGDEC@1.8.5"
          arduino-cli lib install "bb_spi_lcd@2.9.10"
          arduino-cli lib install "TinyGPSPlus@1.0.3"

      - name: Compile firmware for Waveshare N16R8
        env:
          FQBN: esp32:esp32:esp32s3:CDCOnBoot=cdc,CPUFreq=240,FlashMode=dio,FlashSize=16M,PartitionScheme=app3M_fat9M_16MB,PSRAM=opi
        run: arduino-cli compile --fqbn "$FQBN" --warnings all --output-dir "$RUNNER_TEMP/pocketos-build" .

      - name: Locate boot_app0.bin
        id: boot-app0
        run: |
          mapfile -t FILES < <(find "$HOME/.arduino15/packages/esp32" -type f -name boot_app0.bin -print)
          if [ "${#FILES[@]}" -ne 1 ]; then echo "Expected one boot_app0.bin; found ${#FILES[@]}" >&2; exit 1; fi
          echo "path=${FILES[0]}" >> "$GITHUB_OUTPUT"

      - name: Package firmware and Web Flasher
        env:
          POCKETOS_SOURCE_SHA: ${{ steps.source.outputs.sha }}
          RELEASE_VERSION: PocketOS-${{ inputs.release_tag }}
        run: |
          python3 scripts/package_firmware.py "$RUNNER_TEMP/pocketos-build" "$RUNNER_TEMP/pocketos-release" "${{ steps.boot-app0.outputs.path }}"
          mkdir -p "$RUNNER_TEMP/pocketos-pages"
          cp webflasher/index.html "$RUNNER_TEMP/pocketos-pages/index.html"
          cp "$RUNNER_TEMP/pocketos-release/"* "$RUNNER_TEMP/pocketos-pages/"

      - name: Build release selector catalogue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release list --limit 100 --json tagName,name,isPrerelease > "$RUNNER_TEMP/releases.json"
          python3 - "$RUNNER_TEMP/pocketos-pages" "$RUNNER_TEMP/releases.json" "$RELEASE_TAG" <<'PY'
          import json, pathlib, subprocess, sys
          root = pathlib.Path(sys.argv[1])
          existing = json.loads(pathlib.Path(sys.argv[2]).read_text())
          current_tag = sys.argv[3]
          releases = [{"name": current_tag + " (текущая сборка)", "tag": current_tag, "path": "./",
                       "prerelease": any(x in current_tag.lower() for x in ("alpha", "beta", "rc", "pre"))}]
          for item in existing:
              tag = item["tagName"]
              if tag == current_tag: continue
              folder = root / "releases" / tag
              folder.mkdir(parents=True, exist_ok=True)
              subprocess.run(["gh", "release", "download", tag, "--dir", str(folder),
                  "--pattern", "*.bin", "--pattern", "manifest.json", "--pattern", "SHA256SUMS"], check=True)
              required = ["manifest.json", "SHA256SUMS", "bootloader.bin", "partitions.bin", "boot_app0.bin", "application.bin"]
              if not all((folder / name).is_file() for name in required): raise SystemExit(f"Incomplete firmware assets for {tag}")
              releases.append({"name": item["name"] or tag, "tag": tag, "path": f"./releases/{tag}/", "prerelease": bool(item["isPrerelease"])})
          (root / "releases.json").write_text(json.dumps({"releases": releases}, ensure_ascii=False, indent=2) + "\n")
          print(f"Release selector entries: {len(releases)}")
          PY

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          RELEASE_ARGS=()
          if [[ "$RELEASE_TAG" =~ (alpha|beta|rc|pre) ]]; then RELEASE_ARGS+=(--prerelease); fi
          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/pocketos-release/PocketOS-firmware.zip" \
            "$RUNNER_TEMP/pocketos-release/bootloader.bin" \
            "$RUNNER_TEMP/pocketos-release/partitions.bin" \
            "$RUNNER_TEMP/pocketos-release/boot_app0.bin" \
            "$RUNNER_TEMP/pocketos-release/application.bin" \
            "$RUNNER_TEMP/pocketos-release/manifest.json" \
            "$RUNNER_TEMP/pocketos-release/SHA256SUMS" \
            --target "$SOURCE_SHA" --title "PocketOS $RELEASE_TAG — Waveshare N16R8 / DIO" \
            "${RELEASE_ARGS[@]}" --notes-file "RELEASE_NOTES_${RELEASE_TAG}.md"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Web Flasher site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pocketos-pages

      - name: Deploy Web Flasher
        uses: actions/deploy-pages@v4

      - name: Upload firmware build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocketos-${{ inputs.release_tag }}-firmware
          path: ${{ runner.temp }}/pocketos-release/*
          if-no-files-found: error
